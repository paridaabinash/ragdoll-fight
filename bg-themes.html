<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background themes</title>
<style>
  :root { --bg:#05060a; --text:#e6e8ee; --muted:#9aa0ac; --ok:#7fdc9a; --bad:#ff7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1340px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin:0 0 6px; font-size: 26px; font-weight: 650; }
  .lead { margin:0 0 24px; color: var(--muted); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 28px 24px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  figure { margin:0; }
  canvas { display:block; width:100%; height:auto; aspect-ratio: 16 / 9; border-radius: 6px; background:#000; }
  h2 { margin: 10px 0 2px; font-size: 16px; font-weight: 600; }
  .desc { margin:0; color: var(--muted); font-size: 14px; }
  .check { margin: 4px 0 0; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  .check.ok { color: var(--ok); } .check.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Background themes</h1>
  <p class="lead">Same fight in every scene; only the background changes. Pick one theme for all arenas, or one per arena.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
"use strict";
const W = 640, H = 360;

// ---- rules (checked, not guessed) ----
const MAX_BG_LUM = 0.05;      // WCAG relative luminance of any backdrop pixel
const MAX_BG_CHROMA = 0.20;   // (max-min)/255 of any backdrop pixel: keeps it dull
const MIN_PLAYER_CONTRAST = 3;
const MAX_STAR_ALPHA = 0.35;
const MAX_GLOW_ALPHA = 0.30;
const PLAYERS = { cyan:"#00e5ff", pink:"#ff2bd6", lime:"#76ff03", yellow:"#ffea00" };

// ---- small helpers ----
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lin(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function lum(r, g, b) { return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); }
function contrast(a, b) { const hi = Math.max(a, b), lo = Math.min(a, b); return (hi + 0.05) / (lo + 0.05); }
function toHex(r, g, b) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join(""); }
function rgba(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
function darker(hex, k) { const [r, g, b] = hexRgb(hex); return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`; }

function vGrad(ctx, stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([t, c]) => g.addColorStop(t, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function glow(ctx, x, y, r, rgb, a) {
  if (a > MAX_GLOW_ALPHA) throw new Error("glow alpha too high");
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(rgb, a)); g.addColorStop(0.5, rgba(rgb, a * 0.45)); g.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// Stars: tiny, sparse, faint, static, kept to the upper part.
function stars(ctx, seed, count, maxA, yMax) {
  if (maxA > MAX_STAR_ALPHA) throw new Error("star alpha too high");
  const r = rng(seed);
  for (let i = 0; i < count; i++) {
    const x = r() * W, y = Math.pow(r(), 1.4) * yMax, a = 0.12 + r() * (maxA - 0.12);
    ctx.fillStyle = `rgba(220,226,240,${a.toFixed(2)})`;
    const s = r() < 0.85 ? 1 : 1.5;
    ctx.fillRect(Math.round(x), Math.round(y), s, s);
  }
}

// Soft blurred shape helper: draws fn's path with a blur filter.
function soft(ctx, blur, fill, pathFn) {
  ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.fillStyle = fill;
  ctx.beginPath(); pathFn(); ctx.fill(); ctx.restore();
}
// A ridge silhouette from a list of [x, y] points, closed to the bottom.
function ridge(ctx, fill, pts) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], H);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(pts[pts.length - 1][0], H); ctx.closePath(); ctx.fill();
}
// A few slightly brighter stars with a tiny soft cross (still faint, static).
function crossStars(ctx, list) {
  for (const [x, y, a] of list) {
    if (a > MAX_STAR_ALPHA) throw new Error("star alpha too high");
    ctx.fillStyle = `rgba(225,230,245,${a})`; ctx.fillRect(x - 0.5, y - 0.5, 2, 2);
    ctx.fillStyle = `rgba(225,230,245,${(a * 0.35).toFixed(2)})`;
    ctx.fillRect(x - 3.5, y, 7, 1); ctx.fillRect(x, y - 3.5, 1, 7);
  }
}

// ---- the 4 themes: back() is the backdrop (pixel-checked), extra() is star dust (alpha-checked) ----
const THEMES = [
  {
    name: "Deep Space", accent: "#3fd0c9",
    desc: "Blue-black void, a violet nebula split by a dark dust lane, a huge dim planet crescent top-right and a small far moon top-left.",
    back(ctx) {
      vGrad(ctx, [[0, "#070a16"], [1, "#04060c"]]);
      glow(ctx, 190, 100, 240, [70, 55, 130], 0.16);
      glow(ctx, 260, 70, 120, [90, 60, 120], 0.08);
      // dust lane: a dark soft streak through the nebula
      soft(ctx, 16, "rgba(4,5,10,0.75)", () => ctx.ellipse(205, 98, 150, 16, -0.32, 0, Math.PI * 2));
      soft(ctx, 10, "rgba(4,5,10,0.5)", () => ctx.ellipse(150, 120, 70, 8, -0.2, 0, Math.PI * 2));
      // big planet: dark disc, lit rim on the lower-left side only (a crescent)
      const px = 610, py = -40, pr = 170;
      ctx.save();
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#080b16"; ctx.fillRect(0, 0, W, H);
      // two very soft cloud belts on the planet
      ctx.fillStyle = "rgba(30,40,70,0.35)";
      ctx.beginPath(); ctx.ellipse(px, py + 70, pr, 14, 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(px, py + 110, pr, 9, 0.18, 0, Math.PI * 2); ctx.fill();
      const lit = ctx.createRadialGradient(px + 60, py - 40, pr * 0.75, px + 30, py - 20, pr * 1.25);
      lit.addColorStop(0, "rgba(40,52,88,0)"); lit.addColorStop(1, "rgba(40,52,88,0.85)");
      ctx.fillStyle = lit; ctx.fillRect(0, 0, W, H);
      ctx.restore();
      glow(ctx, px - 70, py + 110, 150, [60, 80, 140], 0.07); // atmosphere haze
      // small far moon, lit from the same side
      const mx = 70, my = 52, mr = 13;
      ctx.save(); ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#0b0e1a"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#262c42"; ctx.beginPath(); ctx.arc(mx - 5, my + 4, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0b0e1a"; ctx.beginPath(); ctx.arc(mx + 1, my - 1, mr - 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    },
    extra(ctx) {
      stars(ctx, 7, 34, 0.30, 230);
      crossStars(ctx, [[330, 30, 0.34], [118, 170, 0.3], [470, 132, 0.3], [24, 120, 0.28]]);
    },
  },
  {
    name: "Moonlit Night", accent: "#9fb8e8",
    desc: "Navy sky, a shaded cratered moon with a cloud wisp across it, a far hill line with a few pines and a lone radio mast.",
    back(ctx) {
      vGrad(ctx, [[0, "#0b1430"], [0.7, "#080e22"], [1, "#060a18"]]);
      glow(ctx, 480, 78, 170, [110, 130, 190], 0.13);
      const mx = 480, my = 78, mr = 30;
      ctx.save(); ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#323b52"; ctx.fillRect(0, 0, W, H);
      // shading on the lower-left and craters
      const sh = ctx.createRadialGradient(mx + 10, my - 10, 8, mx + 6, my - 6, mr * 1.5);
      sh.addColorStop(0, "rgba(10,14,26,0)"); sh.addColorStop(1, "rgba(10,14,26,0.45)");
      ctx.fillStyle = sh; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(20,26,40,0.28)";
      for (const [x, y, r] of [[-8, -6, 9], [10, 10, 6], [-12, 12, 4], [8, -14, 3.5], [16, -2, 3]]) {
        ctx.beginPath(); ctx.arc(mx + x, my + y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      // cloud wisps: dark-ish blurred streaks in front of the moon and sky
      soft(ctx, 6, "rgba(16,22,42,0.8)", () => ctx.ellipse(470, 92, 70, 5, -0.05, 0, Math.PI * 2));
      soft(ctx, 9, "rgba(16,22,42,0.55)", () => ctx.ellipse(560, 104, 60, 6, -0.04, 0, Math.PI * 2));
      soft(ctx, 10, "rgba(40,50,80,0.18)", () => ctx.ellipse(170, 60, 110, 7, 0.02, 0, Math.PI * 2));
      // far hill line, barely darker than the sky
      const hill = x => 262 - 22 * Math.sin(x / 150 + 0.6) - 10 * Math.sin(x / 61);
      const pts = []; for (let x = 0; x <= W; x += 8) pts.push([x, hill(x)]);
      ridge(ctx, "#070c1c", pts);
      // a few pines at the far edges and one radio mast, same dark tone
      ctx.fillStyle = "#070c1c";
      for (const [x, h] of [[22, 26], [38, 18], [52, 22], [600, 24], [616, 17]]) {
        const b = hill(x) + 2;
        ctx.beginPath(); ctx.moveTo(x - h * 0.28, b); ctx.lineTo(x, b - h); ctx.lineTo(x + h * 0.28, b); ctx.closePath(); ctx.fill();
      }
      const tx = 560, tb = hill(tx) + 2;
      ctx.beginPath(); ctx.moveTo(tx - 5, tb); ctx.lineTo(tx - 1, tb - 46); ctx.lineTo(tx + 1, tb - 46); ctx.lineTo(tx + 5, tb); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(120,40,40,0.25)"; ctx.fillRect(tx - 1, tb - 49, 2, 2); // dim static warning lamp
    },
    extra(ctx) { stars(ctx, 21, 16, 0.22, 170); },
  },
  {
    name: "Eclipse", accent: "#e0a040",
    desc: "Near-black sky, a dark sun with a dim amber corona and soft streamers, a faint warm band on the horizon behind dark mountains.",
    back(ctx) {
      vGrad(ctx, [[0, "#0a0807"], [1, "#050506"]]);
      const x = 320, y = 74, r = 38;
      glow(ctx, x, y, 210, [110, 85, 55], 0.08);           // wide warm haze
      // horizon glow band
      const hb = ctx.createLinearGradient(0, 190, 0, 290);
      hb.addColorStop(0, "rgba(120,85,50,0)"); hb.addColorStop(0.7, "rgba(120,85,50,0.10)"); hb.addColorStop(1, "rgba(120,85,50,0.04)");
      ctx.fillStyle = hb; ctx.fillRect(0, 190, W, 100);
      // corona streamers: long soft tapered wedges
      ctx.save(); ctx.filter = "blur(7px)";
      for (const [ang, len, wid, a] of [[-0.5, 95, 12, 0.07], [0.45, 80, 10, 0.06], [2.7, 90, 12, 0.06], [3.5, 70, 9, 0.05], [1.55, 60, 8, 0.04], [-1.6, 55, 8, 0.05]]) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
        ctx.fillStyle = `rgba(190,150,100,${a})`;
        ctx.beginPath(); ctx.moveTo(r - 4, -wid); ctx.quadraticCurveTo(r + len * 0.5, -wid * 0.3, r + len, 0);
        ctx.quadraticCurveTo(r + len * 0.5, wid * 0.3, r - 4, wid); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
      const c = ctx.createRadialGradient(x, y, r, x, y, r + 34); // corona
      c.addColorStop(0, "rgba(200,155,95,0.16)"); c.addColorStop(0.35, "rgba(180,130,80,0.06)"); c.addColorStop(1, "rgba(180,130,80,0)");
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r + 34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#030303"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(210,170,110,0.15)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r + 1, 0, Math.PI * 2); ctx.stroke();
      // far mountains, then a nearer darker range
      ridge(ctx, "#0b0909", [[0, 236], [40, 222], [90, 240], [150, 212], [205, 236], [260, 228], [330, 246], [400, 224], [455, 238], [520, 206], [580, 232], [640, 218]]);
      ridge(ctx, "#070606", [[0, 254], [60, 240], [120, 258], [190, 246], [250, 262], [400, 262], [470, 244], [540, 256], [600, 238], [640, 250]]);
    },
    extra() {},
  },
  {
    name: "Aurora", accent: "#4fdc8c",
    desc: "Teal-black sky with three soft aurora curtains, their faint glow on the horizon, and dim snow-capped peaks at the far edges.",
    back(ctx) {
      vGrad(ctx, [[0, "#06100f"], [1, "#040808"]]);
      const band = (y0, amp, thick, rgb, a, phase, blur) => {
        ctx.save(); ctx.filter = `blur(${blur}px)`;
        ctx.fillStyle = rgba(rgb, a);
        ctx.beginPath();
        for (let x = -40; x <= W + 40; x += 10) ctx.lineTo(x, y0 + amp * Math.sin(x / 140 + phase));
        for (let x = W + 40; x >= -40; x -= 10) ctx.lineTo(x, y0 + thick + amp * 0.6 * Math.sin(x / 120 + phase + 0.8));
        ctx.closePath(); ctx.fill(); ctx.restore();
      };
      band(40, 34, 40, [60, 200, 150], 0.15, 0.3, 14);
      band(100, 26, 28, [70, 130, 190], 0.10, 2.1, 14);
      band(14, 18, 22, [110, 90, 170], 0.07, 4.0, 18);
      // aurora light reflected low on the horizon
      ctx.save(); ctx.translate(320, 262); ctx.scale(1, 0.18);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 340);
      g.addColorStop(0, "rgba(60,180,140,0.10)"); g.addColorStop(1, "rgba(60,180,140,0)");
      ctx.fillStyle = g; ctx.fillRect(-400, -400, 800, 800); ctx.restore();
      // snowy peaks at the far edges: dark rock, slightly lighter snow caps
      const peak = (px, py, w) => {
        ctx.fillStyle = "#081110";
        ctx.beginPath(); ctx.moveTo(px - w, H); ctx.lineTo(px, py); ctx.lineTo(px + w, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#16201f";
        const k = 0.16, sx = w * k * (H - py) / (H - py);
        ctx.beginPath(); ctx.moveTo(px, py);
        ctx.lineTo(px + sx, py + (H - py) * k); ctx.lineTo(px + sx * 0.3, py + (H - py) * k * 0.75);
        ctx.lineTo(px - sx * 0.2, py + (H - py) * k * 0.95); ctx.lineTo(px - sx, py + (H - py) * k);
        ctx.closePath(); ctx.fill();
      };
      peak(40, 200, 150); peak(150, 236, 110); peak(610, 190, 150); peak(500, 230, 110);
    },
    extra(ctx) { stars(ctx, 33, 18, 0.25, 200); },
  },
];

// ---- shared foreground (identical in every scene) ----
const GROUND_Y = 300;
const BLOCKS = [
  { x: 0,   y: GROUND_Y, w: 255, h: 60 },
  { x: 385, y: GROUND_Y, w: 255, h: 60 },
  { x: 70,  y: 205, w: 140, h: 14 },
  { x: 420, y: 185, w: 140, h: 14 },
];
function drawTerrain(ctx, accent) {
  for (const b of BLOCKS) {
    ctx.fillStyle = "#0b0c10"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = accent; ctx.fillRect(b.x, b.y, b.w, 2);
  }
}
// facing: 1 = right, -1 = left. aim: angle of the gun (radians, y down).
function figure(ctx, x, footY, color, facing, aim) {
  const back = darker(color, 0.45);
  const hipY = footY - 19, neckY = footY - 35, headY = footY - 42;
  const sh = { x: x, y: neckY + 3 };
  const hand = { x: sh.x + Math.cos(aim) * 15, y: sh.y + Math.sin(aim) * 15 };
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 3.5;
  const seg = (pts, c) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.stroke(); };
  // back limbs first
  seg([[x, hipY], [x - 4 * facing, hipY + 9], [x - 7 * facing, footY]], back);
  seg([[sh.x, sh.y], [sh.x + Math.cos(aim + 0.5) * 8, sh.y + Math.sin(aim + 0.5) * 8 + 2], [hand.x, hand.y]], back);
  // body
  seg([[x, hipY], [x, neckY]], color);
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, headY, 6.5, 0, Math.PI * 2); ctx.fill();
  seg([[x, hipY], [x + 5 * facing, hipY + 9], [x + 7 * facing, footY]], color);
  // gun
  ctx.save(); ctx.translate(hand.x, hand.y); ctx.rotate(aim);
  ctx.fillStyle = "#b9bdc6"; ctx.fillRect(-3, -2.5, 17, 5);
  ctx.fillRect(-1, 1.5, 3, 5 * (Math.cos(aim) >= 0 ? 1 : -1));
  ctx.restore();
  // front arm on top
  seg([[sh.x, sh.y], [sh.x + Math.cos(aim - 0.35) * 8, sh.y + Math.sin(aim - 0.35) * 8], [hand.x, hand.y]], color);
  return { x: hand.x + Math.cos(aim) * 16, y: hand.y + Math.sin(aim) * 16 }; // muzzle
}
function tracer(ctx, x, y, ang, len) {
  ctx.strokeStyle = "#fff59d"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(ang) * len, y - Math.sin(ang) * len); ctx.stroke();
}
function drawForeground(ctx, accent) {
  drawTerrain(ctx, accent);
  const aimC = -0.36, aimP = Math.PI + 0.12, aimL = Math.PI - 0.08;
  const mC = figure(ctx, 165, GROUND_Y, PLAYERS.cyan, 1, aimC);
  figure(ctx, 495, 185, PLAYERS.pink, -1, aimP);
  figure(ctx, 575, GROUND_Y, PLAYERS.lime, -1, aimL);
  // faint dotted aim line from cyan toward pink
  ctx.save(); ctx.strokeStyle = rgba(hexRgb(PLAYERS.cyan), 0.35); ctx.lineWidth = 1.5; ctx.setLineDash([2, 6]);
  ctx.beginPath(); ctx.moveTo(mC.x, mC.y); ctx.lineTo(mC.x + Math.cos(aimC) * 220, mC.y + Math.sin(aimC) * 220); ctx.stroke(); ctx.restore();
  tracer(ctx, mC.x + Math.cos(aimC) * 120, mC.y + Math.sin(aimC) * 120, aimC, 18);   // cyan's shot
  tracer(ctx, 330, 268, aimL, 18);                                                   // lime's shot
}

// ---- contrast check: render the backdrop alone and scan every pixel ----
function checkTheme(t) {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  t.back(ctx);
  const d = ctx.getImageData(0, 0, W, H).data;
  let maxL = 0, maxLc = null, maxCh = 0, maxChc = null;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const L = lum(r, g, b), ch = (Math.max(r, g, b) - Math.min(r, g, b)) / 255;
    if (L > maxL) { maxL = L; maxLc = [r, g, b]; }
    if (ch > maxCh) { maxCh = ch; maxChc = [r, g, b]; }
  }
  const fails = [];
  if (maxL > MAX_BG_LUM) fails.push(`${toHex(...maxLc)} luminance ${maxL.toFixed(3)} > ${MAX_BG_LUM}`);
  if (maxCh > MAX_BG_CHROMA) fails.push(`${toHex(...maxChc)} too saturated (${maxCh.toFixed(2)})`);
  let minC = Infinity, minWho = "";
  for (const [name, hex] of Object.entries(PLAYERS)) {
    const cr = contrast(lum(...hexRgb(hex)), maxL);
    if (cr < minC) { minC = cr; minWho = name; }
    if (cr < MIN_PLAYER_CONTRAST) fails.push(`${name} vs ${toHex(...maxLc)} contrast ${cr.toFixed(2)} < 3`);
  }
  return { ok: fails.length === 0, fails, maxL, minC, minWho };
}

// ---- build the page ----
const grid = document.getElementById("grid");
for (const t of THEMES) {
  const fig = document.createElement("figure");
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  t.back(ctx); t.extra(ctx); drawForeground(ctx, t.accent);
  const res = checkTheme(t);
  const h = document.createElement("h2"); h.textContent = t.name;
  const p = document.createElement("p"); p.className = "desc"; p.textContent = t.desc;
  const k = document.createElement("p"); k.className = "check " + (res.ok ? "ok" : "bad");
  k.textContent = res.ok
    ? `contrast check: OK (brightest backdrop L=${res.maxL.toFixed(3)}, weakest player ${res.minWho} ${res.minC.toFixed(1)}:1)`
    : "contrast check: FAIL - " + res.fails.join("; ");
  fig.append(cv, h, p, k); grid.append(fig);
}
</script>
</body>
</html>
