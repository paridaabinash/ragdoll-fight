<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Ragdoll Archers</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; font-family: system-ui, sans-serif; color: #eceff1; }
    </style>
  </head>
  <body>
    <!-- M4: the live bot fight behind the menu (a Phaser canvas goes in here) -->
    <div id="menu-bg" hidden></div>
    <div id="menu" hidden>
      <div class="menu-shade"></div>
      <main class="menu-main">
        <header class="logo">
          <span class="logo-top">RAGDOLL</span>
          <span class="logo-bottom">ARCHERS<small>.io</small></span>
        </header>
        <div id="invite" class="invite" hidden></div>

        <div class="menu-grid">
          <!-- character card: live ragdoll, name, hat -->
          <section class="card character" aria-label="Your character">
            <div id="preview" class="preview" title="Click to poke"></div>
            <label for="name" class="field-label">Your name</label>
            <input id="name" maxlength="16" autocomplete="nickname" placeholder="archer" />
            <div class="hat-picker">
              <button type="button" id="hat-prev" class="icon-btn" aria-label="Previous hat">‹</button>
              <div class="hat-name"><span id="hat-name">No hat</span><small id="hat-lock"></small></div>
              <button type="button" id="hat-next" class="icon-btn" aria-label="Next hat">›</button>
            </div>
            <div id="hat-help" class="hint"></div>
          </section>

          <!-- play -->
          <section class="play-col">
            <button type="button" id="play" class="btn-play">PLAY</button>
            <div class="btn-row">
              <button type="button" id="new-room" class="btn-sub"><b>+</b> Create room</button>
              <button type="button" id="join-code-btn" class="btn-sub"><b>#</b> Join with code</button>
              <button type="button" id="practice" class="btn-sub"><b>◎</b> Practice</button>
            </div>
            <form id="join-code" class="join-code" hidden>
              <input id="code" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE" aria-label="Room code" />
              <button type="submit" class="btn-small">Join</button>
            </form>
            <div id="status" class="status" role="status"></div>

            <div class="rooms-head">
              <h2>Open rooms</h2>
              <span id="rooms-count" class="hint"></span>
            </div>
            <ul id="rooms" class="rooms"><li class="empty">Looking for rooms...</li></ul>
            <div id="share" class="hint"></div>
          </section>
        </div>
        <footer class="hint foot">Offline test range: <a href="?mode=local">?mode=local</a> · fake lag: <code>?lag=120&amp;jitter=40</code> · cover art: <a href="?mode=cover">?mode=cover</a></footer>
      </main>

      <!-- M1: create a room -->
      <div id="create" class="sheet" hidden>
        <form id="create-form" class="sheet-panel" aria-label="Create a room">
          <div class="sheet-head">
            <h2>Create a room</h2>
            <button type="button" id="create-close" class="icon-btn" aria-label="Close">×</button>
          </div>
          <div class="field-label">Mode</div>
          <div id="modes" class="modes"></div>
          <div class="field-label">Arenas</div>
          <div id="arena-choice" class="seg"></div>
          <div id="arena-hint" class="hint"></div>
          <div id="arenas" class="arenas" hidden></div>
          <div class="opts">
            <div>
              <div class="field-label">Bots</div>
              <div id="bots" class="seg"></div>
            </div>
            <div>
              <div class="field-label">Match length</div>
              <div id="minutes" class="seg"></div>
            </div>
            <div>
              <div class="field-label">Max people <b id="max-out"></b></div>
              <input id="max" type="range" min="2" max="8" step="1" />
            </div>
            <label class="toggle"><input id="private" type="checkbox" /> <span>Private: only people with the code can join</span></label>
          </div>
          <button type="submit" id="create-go" class="btn-play small">CREATE ROOM</button>
        </form>
      </div>
    </div>

    <!-- M2: the arena vote on the results screen (shown over the game) -->
    <div id="vote" class="vote" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
